[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "game-theory-suite"
version = "1.0.0"
description = "Interactive Game Theory Application Suite"
readme = "README.md"
authors = [
    { name = "Taras Zinchenko" },
    { name = "Tim Huijbens" },
    { name = "Jan Jelínek" },
    { name = "Žygimantas Mickavičius" },
    { name = "Jaden Mannes" }
]
requires-python = ">=3.8"
dependencies = [
    "streamlit>=1.20.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "plotly>=5.0.0",
    "matplotlib>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    "."
]
